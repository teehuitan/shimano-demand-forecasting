[project]
name = "stj-sales-forecast"
version = "0.1.0"
description = "STJ Demand Forecasting"
authors = [
    { name = "Lin XinYan", email = "LinXinyan@shimano.com.sg" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy<2.5",  # 2.5 deprecates unit-less timedeltas, which pandas 2.3.3 still creates internally
    "pandas",
    "matplotlib",
    "scipy",
    "shap",
    "xgboost",
    "sqlalchemy",
    "pyodbc",
    "python-dotenv",
    "jupyter",
    "mlflow>=3.15.1",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "openpyxl",
    "statsmodels",
    "patsy",
]

[tool.uv]
package = false
